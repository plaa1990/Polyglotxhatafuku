<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PolyGlot x Hatafuku Studio Pro</title>
    <meta name="description" content="สตูดิโอสร้างสื่อการเรียนรู้ ใบงาน ปริศนา สติกเกอร์ 3D ธีมไลน์ และระบบเรียนภาษา PolyGlot ครบวงจร" />
    <meta property="og:title" content="PolyGlot x Hatafuku Studio Pro" />
    <meta property="og:description" content="สตูดิโอสร้างสื่อการเรียนรู้ ใบงาน ปริศนา สติกเกอร์ 3D ธีมไลน์ และระบบเรียนภาษา PolyGlot ครบวงจร" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Nunito:wght@400;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-gradient-to-b from-sky-100 via-pink-50 to-amber-50 text-slate-800 min-h-screen font-sans antialiased selection:bg-pink-200 selection:text-pink-900">
    <div id="root">
      <div id="boot-msg" style="font-family:sans-serif;text-align:center;padding:48px 16px;color:#64748b">
        🐰 กำลังโหลด PolyGlot × Hatafuku...
      </div>
    </div>
    <script>
      // กันจอขาวเปล่า: แสดง error ให้เห็นบนหน้าจอ แทนที่จะขาวเฉย ๆ
      (function () {
        function show(html) {
          var el = document.getElementById('boot-msg');
          if (!el) return;
          el.style.cssText = 'font-family:sans-serif;padding:20px;max-width:560px;margin:0 auto;color:#334155;text-align:left';
          el.innerHTML = html;
        }
        window.addEventListener('error', function (e) {
          show('<h2>😵 โหลดแอปไม่สำเร็จ</h2><pre style="white-space:pre-wrap;background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px;font-size:12px">' +
            String(e.message || e.error) + '</pre><button onclick="location.reload()" style="padding:8px 14px">รีโหลด</button>');
        });
        window.addEventListener('unhandledrejection', function (e) {
          console.error(e.reason);
        });
        setTimeout(function () {
          if (window.__appBooted) return;
          show('<h2>⚠️ แอปยังไม่เริ่มทำงาน</h2>' +
            '<p>ถ้าเปิดผ่านเซิร์ฟเวอร์ไฟล์ธรรมดา (เช่น http.server / Live Server) จะขาว เพราะ <code>src/main.tsx</code> ต้องผ่าน Vite</p>' +
            '<p>ให้รัน <code>npm install</code> แล้ว <code>npm start</code> (หรือ <code>npm run dev</code>) แล้วเปิด <code>http://localhost:3200</code></p>');
        }, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
