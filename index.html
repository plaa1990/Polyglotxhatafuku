<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Quicksand","Noto Sans Thai",system-ui,sans-serif;color:#3d3566;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:rgba(255,246,251,.9);backdrop-filter:blur(12px);border-bottom:1.5px solid #f6d3e6}
.brand{display:flex;align-items:center;gap:10px;padding:10px 14px 6px}
.av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ffd1e8,#d9ccff);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(167,139,250,.3);flex:none}
.brand h1{margin:0;font-size:15px;line-height:1.15;flex:1;min-width:0}
.brand h1 span{display:block;font-size:11.5px;font-weight:500;color:#8b84b0}
.chips{display:flex;gap:6px;flex:none}
.chip{border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700;border:1.5px solid}
.c1{background:#fff3e0;border-color:#ffd9a0;color:#c25e00}
.c2{background:#e3f4ff;border-color:#b8e0ff;color:#1b6fb5}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;white-space:nowrap;border:1.5px solid #f6d3e6;background:#fff;color:#6a5a9a;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;transition:.15s}
.tab.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#ff7eb6,#a78bfa);box-shadow:0 6px 16px rgba(167,139,250,.35)}
main{max-width:760px;margin:0 auto;padding:14px 14px 110px}
.hero{border-radius:26px;padding:16px 18px;color:#fff;background:linear-gradient(135deg,#ff8fc2 0%,#b79cff 55%,#8ccbff 100%);box-shadow:0 10px 26px rgba(183,156,255,.35);position:relative;overflow:hidden;margin-bottom:14px}
.hero::before{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.25);right:-20px;top:-30px}
.hero::after{content:"";position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(255,236,150,.55);right:70px;bottom:-18px}
.hero b{font-size:19px;display:block;text-shadow:0 1px 2px rgba(120,60,140,.25)}
.hero small{font-size:12.5px;opacity:.95}
h2{font-size:15px;margin:18px 2px 8px;color:#6a5a9a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;border:0;border-radius:24px;padding:14px 14px 16px;min-height:118px;color:#fff;
  border-bottom:6px solid rgba(0,0,0,.18);box-shadow:0 8px 18px rgba(0,0,0,.08);transition:transform .08s}
.tile:active{transform:translateY(3px);border-bottom-width:3px}
.tile .ic{font-size:34px;line-height:1}
.tile .bd{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.28);border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:700}
.tile b{display:block;font-size:15.5px;margin-top:10px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.tile small{display:block;font-size:11px;opacity:.92;margin-top:2px;line-height:1.3}
.g-draw{background:linear-gradient(135deg,#b388ff,#8e6bf2)}
.g-lang{background:linear-gradient(135deg,#4cd387,#22b36a)}
.g-code{background:linear-gradient(135deg,#4ab8ff,#2b8fe6)}
.g-logi{background:linear-gradient(135deg,#ffc83d,#f0a500)}
.g-ws{background:linear-gradient(135deg,#ff7eb6,#ee4f98)}
.g-puz{background:linear-gradient(135deg,#4ab8ff,#6a7bff)}
.g-shop{background:linear-gradient(135deg,#ffb04d,#f07a1a)}
.g-st{background:linear-gradient(135deg,#ff8f9c,#f2566d)}
.g-line{background:linear-gradient(135deg,#5ee08a,#2fbf63)}
.g-type{background:linear-gradient(135deg,#6fd0ff,#3aa7e8)}
.g-more{background:linear-gradient(135deg,#b9a6e6,#8f7ccf)}
.card{background:rgba(255,255,255,.88);border:1.5px solid #f8dcec;border-radius:24px;padding:14px;box-shadow:0 8px 24px rgba(255,126,182,.12)}
.task{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1.5px solid #f1e4f5;border-radius:14px;margin-bottom:7px;background:#fff;font-size:14px}
.task input{width:20px;height:20px;accent-color:#ff6fae;flex:none}
.task.done span{text-decoration:line-through;color:#a9a3c8}
.task button{margin-left:auto;border:0;background:none;color:#c9a3c5;font-size:16px}
.add{display:flex;gap:8px;margin-top:8px}
.add input{flex:1;min-width:0;padding:10px 12px;border:1.5px solid #f6d3e6;border-radius:14px;font:inherit;background:#fff;color:#3d3566}
.add button{border:0;border-radius:14px;padding:0 16px;color:#fff;font-weight:700;background:linear-gradient(135deg,#ff7eb6,#a78bfa)}
.back{border:0;border-radius:999px;padding:9px 16px;color:#fff;font-weight:700;font-size:13.5px;background:linear-gradient(135deg,#ff7eb6,#f0559b);box-shadow:0 6px 14px rgba(255,126,182,.3)}
.cathead{margin-top:12px}
.cathead .row{display:flex;align-items:flex-start;gap:10px;margin-top:12px}
.cathead h3{margin:0;font-size:19px;line-height:1.2;flex:1}
.pill{flex:none;background:#efe6ff;color:#6a45c9;border-radius:14px;padding:5px 10px;font-size:11px;font-weight:700;text-align:center}
.cathead p{margin:6px 0 0;font-size:13px;color:#8b84b0}
.seg{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding:6px;background:#f7f2fb;border-radius:18px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap;border:0;background:transparent;color:#6a5a9a;border-radius:14px;padding:9px 14px;font-size:13px;font-weight:700}
.seg button.on{background:linear-gradient(135deg,#ff7eb6,#a78bfa);color:#fff;box-shadow:0 4px 12px rgba(167,139,250,.35)}
.viewer{margin-top:14px;border-radius:22px;overflow:hidden;border:2px solid #d9ccff;background:#fff;display:flex;flex-direction:column;box-shadow:0 10px 26px rgba(167,139,250,.18)}
.vbar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:linear-gradient(135deg,#8e6bf2,#ff7eb6);color:#fff}
.vbar b{flex:1;font-size:12.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar button,.vbar a{flex:none;border:0;border-radius:10px;padding:7px 10px;background:rgba(255,255,255,.25);color:#fff;font-size:12px;font-weight:700;text-decoration:none}
.vbody{position:relative;height:calc(100vh - 250px);min-height:520px}
.vbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#fdf0f7;color:#8b84b0;font-size:14px;z-index:1}
.viewer.full{position:fixed;inset:0;z-index:60;border-radius:0;margin:0;border:0}
.viewer.full .vbody{height:auto;flex:1;min-height:0}
.fab{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;border:0;border-radius:999px;padding:12px 18px;color:#fff;font-weight:700;font-size:14px;background:linear-gradient(135deg,#ff7eb6,#a78bfa);box-shadow:0 10px 24px rgba(167,139,250,.45)}
#kw-install{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:none;border:0;border-radius:999px;padding:12px 16px;color:#fff;font-weight:700;font-size:14px;background:linear-gradient(135deg,#6fd0ff,#a78bfa);box-shadow:0 10px 24px rgba(111,208,255,.45)}
#kw-hint{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:41;display:none;background:#fff;border:1.5px solid #f6d3e6;border-radius:20px;padding:12px 14px;font-size:13px;box-shadow:0 10px 24px rgba(255,126,182,.25)}
.pal{position:fixed;inset:0;z-index:80;background:rgba(61,53,102,.45);display:none;align-items:flex-start;justify-content:center;padding:calc(60px + env(safe-area-inset-top,0px)) 14px 14px}
.pal.on{display:flex}
.pal .box{width:100%;max-width:520px;background:#fff;border-radius:24px;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:75vh;display:flex;flex-direction:column}
.pal input{width:100%;padding:12px 14px;border:1.5px solid #f6d3e6;border-radius:14px;font:inherit;color:#3d3566;background:#fff}
.pal .res{overflow:auto;margin-top:8px}
.pal .it{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:14px;color:#3d3566}
.pal .it:hover,.pal .it:focus{background:#fdf0f7}
.pal .it small{display:block;color:#8b84b0;font-size:11.5px}
.empty{padding:16px;text-align:center;color:#8b84b0;font-size:13px}

/* ===== Duolingo look ===== */
.top{background:rgba(255,255,255,.92);border-bottom:2px solid #f6d3e6}
.av{width:44px;height:44px;border:3px solid #ffb6d9;background:#fff}
.brand h1{font-size:15px;font-weight:800;color:#2f2a55}
.cheers{flex:none;border-radius:18px;padding:5px 9px;background:#ffe3f1;border:2px solid #ffc2e0;color:#d6246e;font-size:11px;font-weight:800;line-height:1.15;text-align:center}
.chip{border-width:2px;font-weight:800;border-bottom-width:4px}
.c3{background:#ffeaf0;border-color:#ffc4d3;color:#e0314f}
.tab{border-width:2px;border-bottom-width:4px;border-color:#e6dcf5;color:#6a45c9;font-weight:800}
.tab.on{border-color:#d93f8f;background:#ff6fae;box-shadow:none;transform:translateY(0)}
.tab:active{transform:translateY(2px);border-bottom-width:2px}
.hero{border-radius:30px;padding:22px 18px 20px;text-align:center;color:#3d3566;border:4px solid #fff;
  background:linear-gradient(135deg,#cfe8ff 0%,#ffd3e8 55%,#fff1bd 100%);box-shadow:0 12px 28px rgba(183,156,255,.35)}
.hero::before,.hero::after{display:none}
.hero .bun{width:74px;height:74px;margin:0 auto 8px;border-radius:50%;background:#fff;border:4px solid #ffb6d9;display:flex;align-items:center;justify-content:center;font-size:42px}
.hero .tag{display:inline-block;background:#fff;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:800;color:#d6246e;box-shadow:0 3px 8px rgba(214,36,110,.15)}
.hero b{font-size:21px;margin:8px 0 4px;text-shadow:none;color:#3d3566}
.hero small{color:#6a5a9a;font-size:13px;display:block}
.hero .acts{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn3d{border:0;border-radius:16px;padding:12px 18px;font-weight:800;font-size:14px;color:#fff;border-bottom:5px solid rgba(0,0,0,.22);transition:transform .08s}
.btn3d:active{transform:translateY(3px);border-bottom-width:2px}
.b-pu{background:#a56cf3}.b-bl{background:#3bb4f5}.b-pk{background:#ff6fae}
.back{border-radius:16px;background:#ff6fae;border-bottom:4px solid #d93f8f;box-shadow:none}
.tile{border-bottom-width:7px;border-radius:26px}
.seg{background:transparent;padding:2px 0;gap:8px}
.seg button{border:2px solid #e6dcf5;border-bottom-width:4px;background:#fff;border-radius:16px;color:#6a45c9}
.seg button.on{background:#ff6fae;border-color:#d93f8f;box-shadow:none;color:#fff}
.grp{margin-top:14px}
.grp:first-of-type{margin-top:12px}
.grp h4{margin:0 2px 6px;font-size:13.5px;font-weight:800;color:#6a45c9;display:flex;align-items:center;gap:6px}
.grp h4 em{font-style:normal;font-size:10.5px;background:#efe6ff;border-radius:999px;padding:2px 8px;color:#6a45c9}
.grp .seg{margin-top:0;flex-wrap:wrap;overflow:visible}
.grp:nth-of-type(1) .seg button.on{background:#ff6fae;border-color:#d93f8f}
.grp:nth-of-type(2) .seg button.on{background:#3bb4f5;border-color:#1b8fd0}
.grp:nth-of-type(3) .seg button.on{background:#a56cf3;border-color:#7d42d1}

/* ===== หมวดหมู่ฟังก์ชันแบบในวิดีโอ ===== */
.tab{color:var(--a,#6a45c9);border-color:var(--l,#e6dcf5)}
.tab.on{background:var(--a,#ff6fae);border-color:var(--d,#d93f8f);color:#fff}
.tab.sq{padding:8px 12px}
.sec{margin:18px 2px 8px;font-size:15px;font-weight:800;color:#4b3f8f}
.cathead{border:3px solid var(--l,#f8dcec);background:#fff}
.cathead .pill{background:var(--l);color:var(--d);border:1.5px solid var(--a)}
.seg{background:#f6f2fb;border-radius:18px;padding:6px}
.seg button.on{background:var(--a);border-color:var(--d);color:#fff}
.viewer{border-color:var(--l)}
.vbar{background:var(--d)}
.units{margin-top:6px}
.unit{border-radius:22px;padding:14px 16px;color:#fff;position:relative;border-bottom:6px solid rgba(0,0,0,.18);box-shadow:0 8px 18px rgba(0,0,0,.08);margin-top:18px}
.unit b{display:block;font-size:16px;padding-right:46px}
.unit small{display:block;font-size:12px;opacity:.95;margin-top:3px;padding-right:46px}
.unit .num{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 4px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:0;color:#3d3566}
.node .bub{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;background:var(--c);border:5px solid #fff;outline:4px solid var(--c);border-bottom:9px solid rgba(0,0,0,.25);transition:transform .08s}
.node:active .bub{transform:translateY(4px);border-bottom-width:5px}
.node .lb{background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.1);max-width:220px;text-align:center}
.node.lock .bub{background:#c9b8f3;outline-color:#c9b8f3;opacity:.9}
.start{background:#fff;border:2px solid #ff6fae;color:#d6246e;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;box-shadow:0 3px 8px rgba(214,36,110,.2)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#3d3566;color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;z-index:90;display:none}

/* ===== ปรับให้ใช้งานง่ายบนมือถือ ===== */
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{overscroll-behavior-y:none}
main{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.top{transition:transform .25s}.top.hide{transform:translateY(-100%)}
.brand{padding:6px 12px 2px;gap:8px}
.av{width:36px;height:36px;font-size:20px;border-width:2px}
.brand h1{font-size:14px;display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}
.brand h1 span{display:inline;font-size:12px}
.chip{padding:3px 8px;font-size:12.5px}
.tabs{padding:4px 10px 8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.tab{min-height:44px;display:inline-flex;align-items:center;scroll-snap-align:center}
.seg{-webkit-overflow-scrolling:touch}
.seg button{min-height:44px}
.vbar{padding:6px 8px}
.vbar button,.vbar a{min-height:40px;display:inline-flex;align-items:center}
.vbody{height:calc(100dvh - 140px);min-height:420px}
.viewer.full .vbar{padding-top:calc(6px + env(safe-area-inset-top,0px))}
.cathead p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task{min-height:48px}.task input{width:24px;height:24px}.task button{min-width:44px;min-height:44px}
.back{min-height:44px}
input,select,textarea{font-size:16px}
.fab{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:4px;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:2px solid #f6d3e6;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:800;color:#8b84b0;min-height:50px;border-radius:14px}
.bnav button .ic{font-size:21px;line-height:1}
.bnav button.on{color:#d6246e;background:#ffe3f1}
.bnav button:active{transform:scale(.95)}
body.vfull .bnav{display:none}
#kw-install{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
#kw-hint{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.pal{align-items:flex-end;padding:0}
.pal .box{max-width:none;border-radius:24px 24px 0 0;max-height:80dvh;padding:14px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.pal .it{min-height:54px}
@media(max-width:380px){.cheers{display:none}.hero b{font-size:19px}.tile b{font-size:14.5px}}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ls(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

    var ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();

})();

function renderCat(c,modId){

  var cc=COL[c.id]||['#a78bfa','#7d42d1'];
  var h='<div id="cwrap" style="--a:'+cc[0]+';--d:'+cc[1]+';--l:'+cc[0]+'55"><button class="back" data-go="home">← กลับหน้าหลัก</button>';

  if(c.groups){
    c.groups.forEach(function(g){
      h+='<div class="grp"><h4>'+esc(g[0])+' <em>'+esc(g[1])+'</em></h4><div class="seg">';
      g[2].forEach(function(id){var m=c.mods.filter(function(x){return x[0]===id})[0];if(m)h+='<button data-mod="'+m[0]+'" class="'+(m===mod?'on':'')+'">'+esc(m[1])+'</button>'});
      h+='</div></div>';
    });
  }else if(c.mods.length>1){
    h+='<div class="seg">';
    c.mods.forEach(function(m){h+='<button data-mod="'+m[0]+'" class="'+(m===mod?'on':'')+'">'+esc(m[1])+'</button>'});
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="viewer" id="viewer"><div class="vbar"><b>'+esc(mod[1])+'</b><button id="vr" type="button">⟳ รีโหลด</button><button id="vf" type="button">⛶ เต็มจอ</button><a href="'+esc(mod[2])+'" target="_blank" rel="noopener">แท็บใหม่ ↗</a></div>';
  h+='<div class="vbody"><div class="load" id="load">⏳ กำลังโหลด '+esc(mod[1])+'…</div><iframe id="frm" title="'+esc(mod[1])+'" allow="fullscreen; clipboard-read; clipboard-write; autoplay; camera; microphone"></iframe></div></div>';
  h+='</div>';
  $('#app').innerHTML=h;
  var f=$('#frm');f.onload=function(){var l=$('#load');if(l)l.style.display='none';
    try{var dd=f.contentDocument,tx=((dd.title||'')+' '+(dd.body?dd.body.innerText.slice(0,300):''));
      if(/File not found|404|There isn't a GitHub Pages site/i.test(tx)&&dd.body.children.length<15){
        l.style.display='flex';l.style.flexDirection='column';l.style.textAlign='center';l.style.padding='20px';
        l.innerHTML='<div style="font-size:42px">📂</div><b>ไม่พบไฟล์ของเครื่องมือนี้</b><div style="margin-top:6px;font-size:12.5px">ตรวจว่าอัปโหลดไฟล์ครบทุกไฟล์แล้ว<br>('+esc(mod[2])+')</div>'}}catch(e){}
    
    try{var d=f.contentDocument,st=d.createElement('style');st.textContent='.htf-fab{display:none!important}'+(/iphone|ipad|ipod/i.test(navigator.userAgent)?'input,select,textarea{font-size:16px!important}':'');d.head.appendChild(st)}catch(e){}};
  f.src=mod[2];
  markOpened(mod[2]);
  $('#vr').onclick=function(){$('#load').style.display='flex';f.src=f.src};
  $('#vf').onclick=function(){var v=$('#viewer');v.classList.toggle('full');document.body.classList.toggle('vfull',v.classList.contains('full'));this.textContent=v.classList.contains('full')?'⤡ ย่อ':'⛶ เต็มจอ'};

/* ===== เส้นทาง (hash) ===== */
function setNav(id){var m=$('#bnav');if(!m)return;[].forEach.call(m.querySelectorAll('button'),function(b){var k=b.dataset.nav;b.classList.toggle('on',(k==='home'&&id==='home')||(k==='cats'&&id!=='home'&&false))})}
function route(){
  document.body.classList.remove('vfull');var tp=$('.top');if(tp)tp.classList.remove('hide');
  var p=(location.hash||'#home').slice(1).split('/'),id=p[0]||'home';
  document.body.scrollTop=0;window.scrollTo(0,0);
  setNav(id==='home'||!catById(id)?'home':id);
  if(id==='home'||!catById(id)){renderTabs('home');renderHome();return}
  renderTabs(id);renderCat(catById(id),p[1]);
}
function go(h){if(location.hash==='#'+h){route()}else{location.hash=h}}
window.addEventListener('hashchange',route);

document.addEventListener('click',function(e){
  var nv=e.target.closest('[data-nav]');
  if(nv){var k=nv.dataset.nav;
    if(k==='home'){go('home')}
    else if(k==='cats'){go('home');setTimeout(function(){var g=$('.grid');if(g)g.scrollIntoView({behavior:'smooth',block:'start'})},150)}
    else if(k==='find'){openPal()}
    else if(k==='full'){var fb=$('#vf');if(fb)fb.click();else toast('เปิดเครื่องมือจากหมวดก่อนนะ')}
    return}
  var nd=e.target.closest('[data-node]');if(nd){if(nd.dataset.lock==='1'){toast('ทำบทก่อนหน้าให้เสร็จก่อน 🔒');return}var o=ls('kw-opened')||[];var k='node:'+nd.dataset.node;if(o.indexOf(k)<0){o.push(k);ls('kw-opened',o)}go(nd.dataset.node);return}
  if(e.target.closest('[data-openpal]')){openPal();return}
  var t=e.target.closest('[data-go],[data-mod],[data-del],#addtask');if(!t)return;
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.mod){var id=(location.hash.slice(1).split('/')[0]);go(id+'/'+t.dataset.mod);return}
  if(t.dataset.del!==undefined){e.preventDefault();var d=tasks();d.items.splice(+t.dataset.del,1);ls('kw-tasks',d);renderHome();return}
  if(t.id==='addtask'){var v=$('#newtask').value.trim();if(!v)return;var d2=tasks();d2.items.push({t:v,done:false});ls('kw-tasks',d2);renderHome()}
});
document.addEventListener('change',function(e){
  if(e.target.dataset&&e.target.dataset.t!==undefined){var d=tasks();d.items[+e.target.dataset.t].done=e.target.checked;ls('kw-tasks',d);renderHome()}
});
document.addEventListener('keydown',function(e){
  if(e.target.id==='newtask'&&e.key==='Enter'){$('#addtask').click()}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}
  if(e.key==='Escape')closePal();
});

/* ===== เมนูลัด (ค้นหา) ===== */
function openPal(){$('#pal').classList.add('on');$('#q').value='';fill('');setTimeout(function(){$('#q').focus()},50)}
function closePal(){$('#pal').classList.remove('on')}
function fill(q){
  q=q.trim().toLowerCase();var h='',n=0;
  CATS.forEach(function(c){
    c.mods.forEach(function(m){
      var hay=(m[1]+' '+c.title+' '+c.badge+' '+c.sub+' '+c.desc).toLowerCase();
      if(!q||hay.indexOf(q)>=0){n++;h+='<button class="it" data-pal="'+c.id+'/'+m[0]+'"><span style="font-size:22px">'+c.icon+'</span><span>'+esc(m[1])+'<small>'+esc(c.title)+'</small></span></button>'}
    });
  });
  $('#res').innerHTML=h||'<div class="empty">ไม่พบเครื่องมือที่ค้นหา</div>';
}
$('#fab').onclick=openPal;
$('#q').addEventListener('input',function(){fill(this.value)});
$('#pal').addEventListener('click',function(e){
  if(e.target===this){closePal();return}
  var b=e.target.closest('[data-pal]');if(b){closePal();go(b.dataset.pal)}
});

/* ===== ติดตั้งลงมือถือ (PWA) ===== */
(function(){
  var isHttp=/^https?:$/.test(location.protocol);
  if('serviceWorker' in navigator&&isHttp){navigator.serviceWorker.register('./sw.js').catch(function(){})}
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  var btn=$('#kw-install'),hint=$('#kw-hint'),dp=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;if(!standalone)btn.style.display='block'});
  btn.addEventListener('click',function(){if(!dp)return;dp.prompt();dp.userChoice.finally(function(){dp=null;btn.style.display='none'})});
  window.addEventListener('appinstalled',function(){btn.style.display='none'});
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios&&!standalone&&isHttp&&!sessionStorage.getItem('kw-hint')){hint.style.display='block'}
  $('#kw-x').addEventListener('click',function(){hint.style.display='none';try{sessionStorage.setItem('kw-hint','1')}catch(e){}});
})();

(function(){var last=0,top=$('.top');window.addEventListener('scroll',function(){var y=window.scrollY||0;
  if(y>last+10&&y>160)top.classList.add('hide');else if(y<last-10||y<60)top.classList.remove('hide');last=y},{passive:true})})();
route();
</script>
