{const nv=$('#nav'),a=nv.querySelector('.on');if(a)nv.scrollLeft=a.offsetLeft-nv.clientWidth/2+a.offsetWidth/2}

const R={

math:R=>{const mx=+R[0]||20,p=[],k=[];for(let i=0;i<20;i++){const a=rn(mx)+1,b=rn(mx)+1,t=rn(4);let s,r;if(t==0){s=a+' + '+b;r=a+b}else if(t==1){s=Math.max(a,b)+' − '+Math.min(a,b);r=Math.abs(a-b)}else if(t==2){const x=rn(11)+1,y=rn(11)+1;s=x+' × '+y;r=x*y}else{const y=rn(11)+1,q=rn(11)+1;s=y*q+' ÷ '+y;r=q}p.push('<div style="width:50%;display:inline-block;font-size:22px;margin:10px 0">'+(i+1)+'. '+s+' = ______</div>');k.push(r)}return p.join('')+'<p style="font-size:12px;margin-top:16px">เฉลย: '+k.map((v,i)=>(i+1)+'. '+v).join(' · ')+'</p>'},

maze:R=>{const N=Math.min(25,Math.max(5,+R[0]||12)),A=()=>Array.from({length:N},()=>Array(N).fill(1)),v=Array.from({length:N},()=>Array(N).fill(0)),E=A(),S=A(),st=[[0,0]];v[0][0]=1;
while(st.length){const[x,y]=st[st.length-1],nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[x+dx,y+dy,dx,dy]).filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N&&!v[b][a]);if(!nb.length){st.pop();continue}const[a,b,dx,dy]=nb[rn(nb.length)];if(dx==1)E[y][x]=0;if(dx==-1)E[b][a]=0;if(dy==1)S[y][x]=0;if(dy==-1)S[b][a]=0;v[b][a]=1;st.push([a,b])}
const pv={},q=[[0,0]],sn=new Set([0]);while(q.length){const[x,y]=q.shift(),nx=[];if(!E[y][x])nx.push([x+1,y]);if(x>0&&!E[y][x-1])nx.push([x-1,y]);if(y<N-1&&!S[y][x])nx.push([x,y+1]);if(y>0&&!S[y-1][x])nx.push([x,y-1]);nx.forEach(([a,b])=>{if(!sn.has(b*N+a)){sn.add(b*N+a);pv[b*N+a]=[x,y];q.push([a,b])}})}

cross:(R,w)=>{const P=R.map(s=>s.split('=')).filter(p=>p[0].trim()).map(p=>({ch:Array.from(p[0].trim().toUpperCase()),c:(p[1]||'').trim()})).filter(p=>p.ch.length>1).sort((a,b)=>b.ch.length-a.ch.length);if(P.length<2)return'<p>ไม่พบคำพอ: ใส่อย่างน้อย 2 คำ (รูปแบบ คำ=คำใบ้)</p>';
const run=od=>{const g=new Map(),pl=[],pd=new Set([od[0]]),gt=(x,y)=>g.get(x+','+y),ok=(ch,x,y,dx,dy)=>{if(gt(x-dx,y-dy)||gt(x+dx*ch.length,y+dy*ch.length))return 0;let c=0,e=0;for(let i=0;i<ch.length;i++){const X=x+dx*i,Y=y+dy*i,t=gt(X,Y);if(t){if(t!=ch[i])return 0;c++}else{e++;if(gt(X+dy,Y+dx)||gt(X-dy,Y-dx))return 0}}return c>0&&e>0},put=(p,x,y,dx,dy)=>{p.ch.forEach((c,i)=>g.set((x+dx*i)+','+(y+dy*i),c));pl.push({...p,x,y,dx,dy})};

    <div class="a4-page" id="sheet-math">
      <div style="border-bottom: 2px dashed #f472b6; padding-bottom: 12px; margin-bottom: 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <h2 id="view-title" style="font-size: 22px; font-weight: 900; color: #831843; margin:0;">แบบฝึกคิดเลขเร็ว: การบวกเลขสองหลัก</h2>
            <p style="font-size: 11px; color: #9d174d; margin: 4px 0 0 0;">คำสั่ง: จงหาผลลัพธ์ของโจทย์แต่ละข้อให้ถูกต้องและรวดเร็ว</p>
          </div>
          <div style="text-align: right; font-size: 11px; color: #831843; line-height: 1.6;">
            <div>ชื่อ-นามสกุล: _____________________</div>
            <div>ชั้น/ห้อง: ________ วันที่: __________</div>
          </div>
        </div>
      </div>

      <!-- Problem Grid -->
      <div id="math-grid" style="flex:1; display:grid; gap: 14px; grid-template-columns: repeat(4, 1fr); align-content: start;"></div>

      <!-- Footer -->
      <div style="margin-top: 14px; padding-top: 8px; border-top: 1px solid #fce7f3; display:flex; justify-content:space-between; font-size: 10px; color:#9d174d;">
        <span>คะแนนที่ได้: [ _____ / <span id="view-total-points">20</span> ]</span>
        <span>Hatafuku Studio 2.0 • Math Worksheet Suite</span>
        <span>หน้า 1 จาก 1</span>
      </div>
    </div>
  `,run(){
    (function () {
      const selOp = document.getElementById('sel-op');
      const selDigits = document.getElementById('sel-digits');
      const selCount = document.getElementById('sel-count');
      const iptTitle = document.getElementById('ipt-title');
      const chkShow = document.getElementById('chk-show-answers');
      const mathGrid = document.getElementById('math-grid');
      const viewTitle = document.getElementById('view-title');
      const viewTotalPoints = document.getElementById('view-total-points');

      let problems = [];

      function generateProblems() {
        const count = parseInt(selCount.value);
        const digits = parseInt(selDigits.value);
        const opType = selOp.value;

        const max = digits === 1 ? 9 : digits === 2 ? 99 : 999;
        const min = digits === 1 ? 1 : digits === 2 ? 10 : 100;

        problems = [];
        for (let i = 0; i < count; i++) {
          let op = opType;
          if (op === 'mixed') {
            const ops = ['add', 'sub', 'mul'];
            op = ops[Math.floor(Math.random() * ops.length)];
          }

          let a = Math.floor(Math.random() * (max - min + 1)) + min;
          let b = Math.floor(Math.random() * (max - min + 1)) + min;

          if (op === 'sub' && b > a) {
            const tmp = a; a = b; b = tmp;
          }
          if (op === 'div') {
            b = Math.floor(Math.random() * 9) + 2;
            a = b * (Math.floor(Math.random() * 12) + 1);
          }

          let ans = 0;
          let sym = '+';
          if (op === 'add') { ans = a + b; sym = '+'; }
          else if (op === 'sub') { ans = a - b; sym = '-'; }
          else if (op === 'mul') { ans = a * b; sym = '×'; }
          else if (op === 'div') { ans = a / b; sym = '÷'; }

          problems.push({ id: i + 1, a, b, sym, ans });
        }

        render();
      }

      function render() {
        viewTitle.textContent = iptTitle.value || 'แบบฝึกคิดเลขเร็ว';
        viewTotalPoints.textContent = problems.length;
        const showAns = chkShow.checked;

        const cols = problems.length === 12 ? 3 : problems.length === 20 ? 4 : 5;
        mathGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        mathGrid.innerHTML = problems.map(p => `
          <div class="math-prob-box">
            <div style="font-size: 11px; color:#64748b; align-self: flex-start; margin-bottom: 2px;">(${p.id})</div>
            <div style="text-align: right; width: 100%;">
              <div>${p.a}</div>
              <div style="border-bottom: 1.5px solid #0f172a; padding-bottom: 2px;">${p.sym} ${p.b}</div>
              <div style="min-height: 24px; padding-top: 4px; color: ${showAns ? '#e11d48' : 'transparent'}; font-weight: 900;">
                ${showAns ? p.ans : '&nbsp;'}
              </div>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('btn-randomize').onclick = generateProblems;
      selOp.onchange = generateProblems;
      selDigits.onchange = generateProblems;
      selCount.onchange = generateProblems;
      iptTitle.oninput = () => viewTitle.textContent = iptTitle.value;
      chkShow.onchange = render;
      document.getElementById('btn-print').onclick = () => window.print();

      if (window.HatafukuCore && window.HatafukuCore.setupModuleToolbar) {
        window.HatafukuCore.setupModuleToolbar({
          moduleKey: 'math',
          pageSelector: '.a4-page',
          getTitle: () => iptTitle.value,
          onSave: () => ({ op: selOp.value, digits: selDigits.value, count: selCount.value, title: iptTitle.value }),
          onLoad: (data) => {
            if (data.op) selOp.value = data.op;
            if (data.digits) selDigits.value = data.digits;
            if (data.count) selCount.value = data.count;
            if (data.title) iptTitle.value = data.title;
            generateProblems();
          }
        });
      }

      generateProblems();
    })();
  }},
